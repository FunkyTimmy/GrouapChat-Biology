<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Favorites</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <button class="logo-btn" onclick="navigate('./')" id="logo-btn"><span class="logo-badge" id="logo-badge"></span><span class="logo-text" id="logo-text"></span></button>
      <nav class="nav" role="navigation">
        <button class="nav-btn" data-route="./" onclick="navigate('./')"><span>Games</span></button>
        <button class="nav-btn" data-route="apps" onclick="navigate('apps')"><span>Apps</span></button>
        <button class="nav-btn active" data-route="favorites" onclick="navigate('favorites')"><span>Favorites</span><span class="nav-badge hidden" id="fav-count">0</span></button>
        <button class="nav-btn" data-route="code" onclick="navigate('code')"><span>Code</span></button>
      </nav>
      <div class="spacer-flex"></div>
      <button class="icon-btn" onclick="toggleTheme()"><svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle></svg></button>
    </div>
  </header>
  <main class="main"><div id="view-fav" class="container"></div></main>
  <footer class="footer"><div class="footer-inner"><div class="footer-brand"><span class="footer-badge" id="footer-badge"></span><span><strong id="footer-name"></strong><span> · </span><span id="footer-tagline"></span></span></div><p>© <span id="year"></span> <span id="footer-copy-name"></span>.</p></div></footer>

  <script src="config.js"></script><script src="app.js"></script>
  <script>
    function renderCurrentView() {
      const favGames = favorites.map(getGameById).filter(Boolean);
      let html = `<div class="grid-header"><div><h2>Your Favorites</h2><p>${favGames.length} saved</p></div></div>`;
      if (favGames.length === 0) {
        html += '<div class="empty"><h3>No favorites yet</h3><p>Tap the heart on any game card to save it here.</p><button class="btn btn-emerald" onclick="navigate(\'./\')">Browse games</button></div>';
      } else {
        html += '<div class="game-grid">';
        favGames.forEach(g => html += renderCard(g, g.genre ? 'game' : 'app'));
        html += '</div>';
      }
      document.getElementById("view-fav").innerHTML = html;
    }
    initBase('favorites');
    renderCurrentView();
  </script>
</body>
</html>
