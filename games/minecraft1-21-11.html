<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 1.21.11 Download</title>
    <style>
        /* Reset and Base Styles */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-image: url("https://cdn.jsdelivr.net/gh/FunkyTimmy/little-timmy-codepen@main/minecraft-thmbnail.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Dark overlay to make text readable over the background */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        /* Main Card Container */
        .card {
            position: relative;
            z-index: 2;
            background-color: #1e1e1e; /* Dark stone/coal color - NO NEON */
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: #d4d4d4; /* Off-white text */
        }

        .card h2 {
            margin: 0 0 10px 0;
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .card p {
            margin: 0 0 20px 0;
            color: #9a9a9a;
            font-size: 15px;
            line-height: 1.5;
        }

        /* Download Button - Muted Grass Green */
        .download-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: #4a7a4a; 
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-bottom: 30px;
        }

        .download-btn:hover {
            background-color: #5a8f5a; /* Slightly lighter on hover */
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .download-btn:disabled {
            background-color: #3a3a3a;
            color: #7a7a7a;
            cursor: not-allowed;
            transform: none;
        }

        /* Divider */
        .divider {
            height: 1px;
            background-color: #3a3a3a;
            margin-bottom: 25px;
            border: none;
        }

        /* Instructions Section */
        .instructions h3 {
            margin: 0 0 10px 0;
            color: #c8c8c8;
            font-size: 18px;
            font-weight: 600;
        }

        .instructions p {
            font-size: 14px;
            margin-bottom: 15px;
        }

        /* URL Display Box */
        .url-box {
            display: inline-block;
            background-color: #2b2b2b;
            color: #8fb88f; /* Muted green for the URL */
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.2s ease;
            margin-bottom: 15px;
        }

        .url-box:hover {
            background-color: #353535;
        }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="card">
        <h2>Minecraft 1.21.11</h2>
        <p>Click below to download the game files directly to your computer.</p>
        
        <button id="downloadBtn" class="download-btn" onclick="downloadGame()">Download Game</button>

        <hr class="divider">

        <div class="instructions">
            <h3>Next Step</h3>
            <p>Once the download is complete, visit this link below and upload the code to play</p>
            <a href="https://gcbiology.com/code" target="_blank" class="url-box">GC Biology IDE</a>
            <p style="font-size: 12px; color: #777; margin-top: 10px;">Opens in a new tab for your convenience.</p>
        </div>
    </div>

    <script>
        const GAME_URL = "https://cdn.jsdelivr.net/gh/FunkyTimmy/little-timmy-codepen@main/Eaglercraft_1.21.11_WASM_Offline_Download%20(7)%20(1).html";
        const FILE_NAME = "Eaglercraft_1.21.11.html";

        async function downloadGame() {
            const btn = document.getElementById('downloadBtn');
            btn.innerText = 'Preparing Download...';
            btn.disabled = true;

            try {
                const response = await fetch(GAME_URL);
                if (!response.ok) throw new Error('File not found or network error');
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = FILE_NAME; 
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(url);
                a.remove();
                
                btn.innerText = 'Download Started!';

            } catch (error) {
                console.error('Download Error:', error);
                window.open(GAME_URL, '_blank');
                btn.innerText = 'Opened in New Tab (Save Manually)';
            }

            setTimeout(() => {
                btn.innerText = 'Download Game';
                btn.disabled = false;
            }, 4000);
        }
    </script>
</body>
</html>
