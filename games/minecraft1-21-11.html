<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 1.21.11 Download</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background-image: url("https://cdn.jsdelivr.net/gh/FunkyTimmy/little-timmy-codepen@main/minecraft-thmbnail.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .card {
            position: relative;
            z-index: 2;
            background-color: #1e1e1e;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 40px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: #d4d4d4;
        }

        .card h2 {
            margin: 0 0 10px 0;
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .card p {
            margin: 0 0 20px 0;
            color: #9a9a9a;
            font-size: 15px;
            line-height: 1.5;
        }

        .download-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: #4a7a4a; 
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-bottom: 30px;
        }

        .download-btn:hover {
            background-color: #5a8f5a;
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .download-btn:disabled {
            background-color: #3a3a3a;
            color: #7a7a7a;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            height: 1px;
            background-color: #3a3a3a;
            margin-bottom: 25px;
            border: none;
        }

        .instructions h3 {
            margin: 0 0 10px 0;
            color: #c8c8c8;
            font-size: 18px;
            font-weight: 600;
        }

        .instructions p {
            font-size: 14px;
            margin-bottom: 15px;
        }

        .url-box {
            display: inline-block;
            background-color: #2b2b2b;
            color: #8fb88f;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: background-color 0.2s ease;
            margin-bottom: 15px;
        }

        .url-box:hover {
            background-color: #353535;
        }

    </style>
</head>
<body>

    <div class="overlay"></div>

    <div class="card">
        <h2>Minecraft 1.21.11</h2>
        <p>To get the file for this game, please ask one of the developers in real life for the code</p>

        <hr class="divider">

        <div class="instructions">
            <h3>Next Step</h3>
            <p>Once you have the code downloaded, visit this link below and upload the code to play</p>
            <a href="https://gcbiology.com/code" target="_blank" class="url-box">GC Biology IDE</a>
            <p style="font-size: 12px; color: #777; margin-top: 10px;">Opens in a new tab for your convenience.</p>
        </div>
    </div>
</body>
</html>
