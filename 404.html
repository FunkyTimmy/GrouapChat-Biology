<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>404 Not Found</title>
  <link rel="stylesheet" href="style.css">
</head>

  <header class="header"><div class="header-inner">

  </div></header>
  <main class="main"><div class="container">
    <div class="empty" style="margin-top: 4rem;">
      <div class="empty-icon lg" style="background: var(--accent); color: var(--rose); font-size: 2rem; font-weight: bold;">404</div>

      <p>Oops! The page you are looking for does not exist. It might have been moved or deleted.</p>
      <button class="btn btn-emerald" onclick="navigate('index.html')">Go Back Home</button>

  </div></main>
  <footer class="footer"><div class="footer-inner"><div class="footer-brand"><span class="footer-badge" id="footer-badge"></span><span><strong id="footer-name"></strong><span> · </span><span id="footer-tagline"></span></span></div><p>© <span id="year"></span> <span id="footer-copy-name"></span>.</p></div></footer>

  <script src="config.js"></script><script src="app.js"></script>
  <script>initBase('404.html');</script>
