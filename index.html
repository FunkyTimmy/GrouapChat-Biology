  <!-- Load Configuration File -->
  <script src="config.js"></script>
  
  <script>
    /* ============================================================================
     *  APP LOGIC — you don't need to edit below this line
     * ============================================================================
     */
    /* ---------- State ---------- */
    let currentView = "games";
    let searchQuery = "";
    let activeCategory = "All";
    let activeGame = null;
    let favorites = [];
    let recent = [];
    let codeLayout = "vertical"; // vertical = editors stacked, horizontal = side by side
    let codePreviewKey = 0;
    /* ---------- Storage keys ---------- */
    const FAV_KEY = "arcade:favorites"; // localStorage (primary)
    const FAV_COOKIE = "arcade:favorites"; // legacy cookie (migration only)
    const RECENT_KEY = "arcade:recent-games";
    const CODE_KEY = "arcade:code-editor";
    const THEME_KEY = "arcade:theme";
    /* ---------- Default code for the editor ---------- */
    const DEFAULT_CODE = {
      html: '<div class="card">\n  <h1>Hello, World! 👋</h1>\n  <p>Edit the HTML, CSS, and JS panels to see live changes.</p>\n  <button id="btn">Click me</button>\n</div>\n',
      css: '* {\n  box-sizing: border-box;\n}\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  display: grid;\n  place-items: center;\n  font-family: system-ui, sans-serif;\n  background: linear-gradient(135deg, #0f172a, #1e293b);\n  color: #e2e8f0;\n}\n\n.card {\n  text-align: center;\n  padding: 2.5rem 3rem;\n  border-radius: 1rem;\n  background: rgba(30, 41, 59, 0.6);\n  border: 1px solid rgba(148, 163, 184, 0.15);\n  backdrop-filter: blur(8px);\n  box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.5);\n}\n\nh1 {\n  margin: 0 0 0.5rem;\n  font-size: 1.75rem;\n}\n\np {\n  margin: 0 0 1.5rem;\n  color: #94a3b8;\n}\n\nbutton {\n  padding: 0.6rem 1.5rem;\n  border: none;\n  border-radius: 0.5rem;\n  font-size: 0.95rem;\n  font-weight: 600;\n  color: white;\n  background: linear-gradient(135deg, #10b981, #14b8a6);\n  cursor: pointer;\n  transition: transform 0.15s ease, box-shadow 0.15s ease;\n}\n\nbutton:hover {\n  transform: translateY(-2px);\n  box-shadow: 0 8px 24px -8px rgba(16, 185, 129, 0.6);\n}\n\nbutton:active {\n  transform: translateY(0);\n}\n',
      js: 'const btn = document.getElementById(\'btn\');\nlet count = 0;\n\nbtn.addEventListener(\'click\', () => {\n  count++;\n  btn.textContent = \'Clicked \' + count + \' times\';\n});\n'
    };
    let codeState = {
      html: "",
      css: "",
      js: ""
    };
    /* ---------- Cookie helpers ---------- */
    function getCookie(name) {
      const match = document.cookie.split("; ").find(r => r.startsWith(name + "="));
      return match ? decodeURIComponent(match.split("=").slice(1).join("=")) : null;
    }

    function setCookie(name, value, maxAgeDays) {
      document.cookie = name + "=" + encodeURIComponent(value) + "; max-age=" + (maxAgeDays * 86400) + "; path=/; SameSite=Lax";
    }
    /* ---------- Favorites (localStorage, with one-time cookie migration) ---------- */
    function loadFavorites() {
      // 1) Try localStorage first (primary store — survives across sessions).
      try {
        const raw = localStorage.getItem(FAV_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          if (Array.isArray(p)) return p.filter(v => typeof v === "string");
        }
      } catch {}
      // 2) Fall back to the legacy cookie (one-time migration to localStorage).
      const raw = getCookie(FAV_COOKIE);
      if (raw) {
        try {
          const p = JSON.parse(raw);
          if (Array.isArray(p)) {
            const arr = p.filter(v => typeof v === "string");
            try {
              localStorage.setItem(FAV_KEY, JSON.stringify(arr));
            } catch {}
            return arr;
          }
        } catch {}
      }
      return [];
    }

    function saveFavorites() {
      try {
        localStorage.setItem(FAV_KEY, JSON.stringify(favorites));
      } catch {}
    }

    function isFavorite(id) {
      return favorites.includes(id);
    }

    function toggleFavorite(id) {
      if (favorites.includes(id)) favorites = favorites.filter(x => x !== id);
      else favorites.push(id);
      saveFavorites();
      updateFavCount();
      renderCurrentView();
      if (activeGame && activeGame.id === id) updateModalFav();
    }

    function updateFavCount() {
      const el = document.getElementById("fav-count");
      if (favorites.length > 0) {
        el.textContent = favorites.length;
        el.classList.remove("hidden");
      } else el.classList.add("hidden");
    }
    /* ---------- Recent games ---------- */
    function loadRecent() {
      try {
        const raw = localStorage.getItem(RECENT_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch {
        return [];
      }
    }

    function saveRecent() {
      try {
        localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
      } catch {}
    }

    function addRecent(game) {
      recent = [game, ...recent.filter(g => g.id !== game.id)].slice(0, 8);
      saveRecent();
    }
    /* ---------- Helpers ---------- */
    function getPopular() {
      return GAMES.find(g => g.popular) || GAMES[0];
    }

    function getGameById(id) {
      return GAMES.find(g => g.id === id);
    }

    function searchGames(query, category) {
      const q = query.trim().toLowerCase();
      return GAMES.filter(g => {
        const mc = category === "All" || g.genre === category;
        const mq = !q || g.name.toLowerCase().includes(q) || g.description.toLowerCase().includes(q) || g.genre.toLowerCase().includes(q);
        return mc && mq;
      });
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    /* ---------- Theme ---------- */
    function loadTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved) {
        document.documentElement.setAttribute("data-theme", saved);
        updateThemeIcon(saved);
      } else {
        updateThemeIcon(document.documentElement.getAttribute("data-theme"));
      }
    }

    function toggleTheme() {
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem(THEME_KEY, next);
      updateThemeIcon(next);
      syncEditorTheme();
    }

    function updateThemeIcon(theme) {
      const icon = document.getElementById("theme-icon");
      if (theme === "dark") {
        icon.innerHTML = '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
      } else {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
      }
    }
    /* ---------- View switching ---------- */
    function setView(view) {
      currentView = view;
      document.getElementById("view-games").classList.toggle("hidden", view !== "games");
      document.getElementById("view-favorites").classList.toggle("hidden", view !== "favorites");
      document.getElementById("view-code").classList.toggle("hidden", view !== "code");
      document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.view === view));
      if (view !== "games") {
        searchQuery = "";
        activeCategory = "All";
        syncSearchInputs();
      }
      renderCurrentView();
      if (view === "code") initCodeEditor();
    }

    function syncSearchInputs() {
      document.getElementById("search").value = searchQuery;
      document.getElementById("search-mobile").value = searchQuery;
    }

    function onSearch(val) {
      searchQuery = val;
      syncSearchInputs();
      renderGames();
    }

    function renderCurrentView() {
      if (currentView === "games") renderGames();
      else if (currentView === "favorites") renderFavorites();
    }
    /* ---------- Render: Games ---------- */
    function renderGames() {
      const container = document.getElementById("view-games");
      const popular = getPopular();
      const isBrowsing = searchQuery.trim() !== "" || activeCategory !== "All";
      const showHero = !isBrowsing && popular;
      const showRecent = !isBrowsing && recent.length > 0;
      const filtered = searchGames(searchQuery, activeCategory);
      const noGamesAtAll = filtered.length === 0 && !isBrowsing;
      let html = "";
      if (showHero) html += renderHero(popular);
      if (showRecent) html += renderRecent();
      html += '<section>';
      html += '<div class="grid-header"><div>';
      html += '<h2>' + (searchQuery.trim() ? 'Results for &ldquo;' + escapeHtml(searchQuery.trim()) + '&rdquo;' : 'All games') + '</h2>';
      html += '<p>' + filtered.length + (filtered.length === 1 ? ' game' : ' games') + ' available</p>';
      html += '</div>' + renderChips() + '</div>';
      if (filtered.length === 0) {
        html += noGamesAtAll ? renderNoGames() : renderEmptySearch();
      } else {
        html += '<div class="game-grid">';
        filtered.forEach(g => html += renderCard(g));
        html += '</div>';
      }
      html += '</section>';
      container.innerHTML = html;
    }

    function renderHero(game) {
      return '<section style="margin-bottom:2.5rem"><div class="hero"><div class="hero-grid">' +
        '<div class="hero-img-wrap"><img src="' + escapeHtml(game.thumbnail) + '" alt="' + escapeHtml(game.name) + ' thumbnail" onerror="this.style.display=\'none\'"><span class="hero-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-1px;margin-right:4px"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>' + escapeHtml(game.genre) + '</span></div>' +
        '<div class="hero-body">' +
        '<div class="hero-eyebrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg> Most popular</div>' +
        '<div><h2>' + escapeHtml(game.name) + '</h2><p style="margin-top:.25rem;font-size:.875rem;color:var(--muted-foreground)">Welcome to ' + escapeHtml(SITE.name) + '.</p></div>' +
        '<p class="desc">' + escapeHtml(game.description) + '</p>' +
        '<div class="hero-actions"><button class="btn btn-emerald btn-lg" onclick="playGame(\'' + game.id + '\')"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg> Play now</button>' +
        '<span class="muted-sm">No sign-up · plays instantly</span></div>' +
        '</div></div></div></section>';
    }

    function renderRecent() {
      let cards = recent.map(g => '<div>' + renderCard(g) + '</div>').join("");
      return '<section style="margin-bottom:2.5rem"><div class="section-title"><p class="eyebrow">Pick up where you left off</p><h2>Continue playing</h2></div>' +
        '<div class="recent-row scrollbar-thin">' + cards + '</div></section>';
    }

    function renderChips() {
      const opts = ["All"].concat(GENRES);
      return '<div class="chips scrollbar-thin">' + opts.map(o =>
        '<button class="chip' + (o === activeCategory ? " active" : "") + '" onclick="setCategory(\'' + o.replace(/'/g, "\\'") + '\')">' + escapeHtml(o) + '</button>'
      ).join("") + '</div>';
    }

    function setCategory(c) {
      activeCategory = c;
      renderGames();
    }

    function renderCard(game) {
      const fav = isFavorite(game.id);
      return '<div class="game-card">' +
        '<button class="card-thumb" onclick="playGame(\'' + game.id + '\')" aria-label="Play ' + escapeHtml(game.name) + '">' +
        '<img src="' + escapeHtml(game.thumbnail) + '" alt="' + escapeHtml(game.name) + ' thumbnail" loading="lazy" onerror="this.outerHTML=\'<div class=\\\'card-thumb-fallback\\\'><svg width=32 height=32 viewBox=\\\'0 0 24 24\\\' fill=\\\'none\\\' stroke=\\\'currentColor\\\' stroke-width=\\\'2\\\'><rect x=\\\'3\\\' y=\\\'3\\\' width=\\\'18\\\' height=\\\'18\\\' rx=\\\'2\\\'/><circle cx=\\\'9\\\' cy=\\\'9\\\' r=\\\'2\\\'/><path d=\\\'M21 15l-5-5L5 21\\\'/></svg></div>\'">' +
        '<span class="card-genre">' + escapeHtml(game.genre) + '</span>' +
        '<div class="card-play"><span><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>Play</span></div>' +
        '</button>' +
        '<button class="fav-btn' + (fav ? " active" : "") + '" onclick="event.stopPropagation();toggleFavorite(\'' + game.id + '\')" aria-label="' + (fav ? "Remove from" : "Add to") + ' favorites" aria-pressed="' + fav + '">' +
        '<svg width="16" height="16" viewBox="0 0 24 24" fill="' + (fav ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>' +
        '</button>' +
        '<div class="card-body"><h3>' + escapeHtml(game.name) + '</h3><p>' + escapeHtml(game.description) + '</p></div>' +
        '</div>';
    }

    function renderEmptySearch() {
      return '<div class="empty"><div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="8" x2="8" y2="8"/></svg></div>' +
        '<div><h3>No games found</h3><p>Try a different search term or genre.</p></div>' +
        '<button class="btn btn-outline btn-sm" onclick="clearFilters()">Clear filters</button></div>';
    }

    function renderNoGames() {
      return '<div class="empty"><div class="empty-icon lg gradient"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.152A4 4 0 0 0 17.32 5z"/></svg></div>' +
        '<div><h3>No games yet</h3><p>Add your own games by editing the <code>GAMES</code> array inside <code>config.js</code>. Copy a game block, paste it in, and fill in the fields.</p></div>' +
        '<div class="help-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><div><p class="help-title">Quick start</p><ol><li>Open <code>config.js</code></li><li>Edit the <code>GENRES</code> list</li><li>Copy a game block and paste it into the <code>GAMES</code> array</li><li>Save — refresh the page to see it</li></ol></div></div></div>';
    }

    function clearFilters() {
      searchQuery = "";
      activeCategory = "All";
      syncSearchInputs();
      renderGames();
    }
    /* ---------- Render: Favorites ---------- */
    function renderFavorites() {
      const container = document.getElementById("view-favorites");
      const favGames = favorites.map(getGameById).filter(Boolean);
      let html = '<div class="fav-header"><div class="fav-title-row">' +
        '<span class="fav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></span>' +
        '<div><h2>Your Favorites</h2><p>' + favGames.length + (favGames.length === 1 ? ' game' : ' games') + ' saved · stored in your browser</p></div></div>' +
        (favGames.length > 0 ? '<button class="btn btn-outline btn-sm" onclick="clearFavorites()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg> Clear all</button>' : '') +
        '</div>';
      if (favGames.length === 0) {
        html += '<div class="empty"><div class="empty-icon lg"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/><line x1="2" y1="2" x2="22" y2="22"/></svg></div>' +
          '<div><h3>No favorites yet</h3><p>Tap the heart on any game card to save it here. Your favorites are saved in your browser and persist across sessions.</p></div>' +
          '<button class="btn btn-emerald" onclick="setView(\'games\')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.152A4 4 0 0 0 17.32 5z"/></svg> Browse games</button></div>';
      } else {
        html += '<div class="game-grid">' + favGames.map(renderCard).join("") + '</div>';
      }
      container.innerHTML = html;
    }

    function clearFavorites() {
      favorites = [];
      saveFavorites();
      updateFavCount();
      renderFavorites();
    }
    /* ---------- Game player modal ---------- */
    /* Injects a <base> tag so relative URLs in the fetched game HTML resolve
       against the original jsDelivr URL (not the host page). */
    function injectBaseTag(html, baseUrl) {
      const baseTag = '<base href="' + escapeHtml(baseUrl) + '">';
      if (/<head[^>]*>/i.test(html)) {
        return html.replace(/<head[^>]*>/i, function(m) {
          return m + baseTag;
        });
      }
      if (/<html[^>]*>/i.test(html)) {
        return html.replace(/<html[^>]*>/i, function(m) {
          return m + '<head>' + baseTag + '</head>';
        });
      }
      return baseTag + html;
    }
    async function playGame(id) {
      const game = getGameById(id);
      if (!game) return;
      activeGame = game;
      addRecent(game);
      
      // Update browser tab title to include the game name and the configured suffix
      document.title = game.name + (SITE.titleSuffix || "");
      
      const modal = document.getElementById("player-modal");
      document.getElementById("modal-genre").textContent = game.genre;
      document.getElementById("modal-title").textContent = game.name;
      document.getElementById("modal-loading-text").textContent = "Loading " + game.name + "…";
      const loading = document.getElementById("modal-loading");
      const error = document.getElementById("modal-error");
      loading.classList.remove("hidden");
      error.classList.add("hidden");
      const frame = document.getElementById("modal-frame");
      // Reset any previously loaded content
      frame.onload = null;
      frame.removeAttribute("srcdoc");
      frame.src = "about:blank";
      modal.classList.remove("hidden");
      document.body.style.overflow = "hidden";
      updateModalFav();
      // Fetch the game's HTML and load it via srcdoc (NOT a direct iframe src).
      // This keeps the document on our own origin while a <base> tag makes sure
      // relative assets still resolve against the jsDelivr URL.
      try {
        const res = await fetch(game.fileUrl, {
          mode: "cors"
        });
        if (!res.ok) throw new Error("HTTP " + res.status + (res.statusText ? " " + res.statusText : ""));
        let html = await res.text();
        html = injectBaseTag(html, game.fileUrl);
        frame.onload = function() {
          loading.classList.add("hidden");
        };
        frame.srcdoc = html;
      } catch (err) {
        loading.classList.add("hidden");
        error.classList.remove("hidden");
        const msg = document.getElementById("modal-error-msg");
        if (msg) msg.textContent = (err.message || "Network error") + " — check that fileUrl is a valid jsDelivr URL.";
      }
    }

    function closePlayer() {
      document.getElementById("player-modal").classList.add("hidden");
      const frame = document.getElementById("modal-frame");
      frame.onload = null;
      frame.removeAttribute("srcdoc");
      frame.src = "about:blank";
      document.getElementById("modal-loading").classList.add("hidden");
      document.getElementById("modal-error").classList.add("hidden");
      document.body.style.overflow = "";
      activeGame = null;
      
      // Revert browser tab title back to the default site name
      document.title = SITE.name + (SITE.titleSuffix || "");
    }

    function openGameNewTab() {
      if (!activeGame) return;
      const game = activeGame;
      const frame = document.getElementById("modal-frame");
      // Reuse the HTML already fetched & rendered in the modal (with <base> tag
      // injected) so the new tab loads the game exactly like Play does. If the
      // modal hasn't loaded it yet, fall back to fetching on the spot.
      let html = frame && frame.getAttribute("srcdoc");
      if (html && html.trim() !== "") {
        const blob = new Blob([html], {
          type: "text/html"
        });
        const url = URL.createObjectURL(blob);
        window.open(url, "_blank");
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        return;
      }
      // Fallback: fetch fresh, inject base tag, open as blob
      (async () => {
        try {
          const res = await fetch(game.fileUrl, {
            mode: "cors"
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
          let fetched = await res.text();
          fetched = injectBaseTag(fetched, game.fileUrl);
          const blob = new Blob([fetched], {
            type: "text/html"
          });
          const url = URL.createObjectURL(blob);
          window.open(url, "_blank");
          setTimeout(() => URL.revokeObjectURL(url), 10000);
        } catch (err) {
          // Last resort: open the raw URL directly
          window.open(game.fileUrl, "_blank", "noopener,noreferrer");
        }
      })();
    }

    function toggleFullscreenStage() {
      const el = document.getElementById("modal-stage");
      if (document.fullscreenElement) document.exitFullscreen();
      else el.requestFullscreen();
    }

    function updateModalFav() {
      if (!activeGame) return;
      const fav = isFavorite(activeGame.id);
      const btn = document.getElementById("modal-fav");
      const icon = document.getElementById("modal-fav-icon");
      const label = document.getElementById("modal-fav-label");
      btn.classList.toggle("fav", fav);
      icon.setAttribute("fill", fav ? "currentColor" : "none");
      label.textContent = fav ? "Favorited" : "Favorite";
    }

    function toggleFavoriteModal() {
      if (activeGame) toggleFavorite(activeGame.id);
    }
    /* ---------- Code editor (CodeMirror-powered) ---------- */
    let codeInited = false;
    let previewTimer = null;
    let editors = {
      html: null,
      css: null,
      js: null
    };
    let editorSizes = [33.33, 33.33, 33.34]; // % of editors region (html, css, js)
    let mainSizes = [60, 40]; // % of code-body [editors, preview]
    let cmLoaded = false;
    const CM_VER = "5.65.16";
    const CM_BASE = "https://cdnjs.cloudflare.com/ajax/libs/codemirror/" + CM_VER;
    const BEAUTIFY_VER = "1.15.1";
    const BEAUTIFY_BASE = "https://cdnjs.cloudflare.com/ajax/libs/js-beautify/" + BEAUTIFY_VER;

    function loadScript(src) {
      return new Promise((res, rej) => {
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.onload = () => res();
        s.onerror = () => rej(new Error("Failed to load " + src));
        document.head.appendChild(s);
      });
    }

    function loadStyle(href) {
      return new Promise((res, rej) => {
        const l = document.createElement("link");
        l.rel = "stylesheet";
        l.href = href;
        l.onload = () => res();
        l.onerror = () => rej(new Error("Failed to load " + href));
        document.head.appendChild(l);
      });
    }
    async function loadCodeEditorLibs() {
      if (cmLoaded) return;
      await Promise.all([
        loadStyle(CM_BASE + "/codemirror.min.css"),
        loadStyle(CM_BASE + "/theme/dracula.min.css"),
        loadStyle(CM_BASE + "/theme/eclipse.min.css"),
      ]);
      await loadScript(CM_BASE + "/codemirror.min.js");
      await Promise.all([
        loadScript(CM_BASE + "/mode/xml/xml.min.js"),
        loadScript(CM_BASE + "/mode/css/css.min.js"),
        loadScript(CM_BASE + "/mode/javascript/javascript.min.js"),
        loadScript(CM_BASE + "/mode/htmlmixed/htmlmixed.min.js"),
        loadScript(CM_BASE + "/addon/edit/closebrackets.min.js"),
        loadScript(CM_BASE + "/addon/edit/closetag.min.js"),
        loadScript(CM_BASE + "/addon/edit/matchbrackets.min.js"),
        loadScript(CM_BASE + "/addon/selection/active-line.min.js"),
        loadScript(CM_BASE + "/addon/display/placeholder.min.js"),
      ]);
      await Promise.all([
        loadScript(BEAUTIFY_BASE + "/beautify.min.js"),
        loadScript(BEAUTIFY_BASE + "/beautify-css.min.js"),
        loadScript(BEAUTIFY_BASE + "/beautify-html.min.js"),
      ]);
      cmLoaded = true;
    }

    function cmTheme() {
      return document.documentElement.getAttribute("data-theme") === "dark" ? "dracula" : "eclipse";
    }

    function syncEditorTheme() {
      if (!editors || !editors.html) return;
      const t = cmTheme();
      editors.html.setOption("theme", t);
      editors.css.setOption("theme", t);
      editors.js.setOption("theme", t);
    }

    function makeEditor(textareaId, mode, placeholder) {
      const ta = document.getElementById(textareaId);
      const cm = CodeMirror.fromTextArea(ta, {
        mode: mode,
        theme: cmTheme(),
        lineNumbers: true,
        lineWrapping: false,
        indentUnit: 2,
        tabSize: 2,
        indentWithTabs: false,
        smartIndent: true,
        electricChars: true,
        autoCloseBrackets: {
          pairs: '()[]{}\'\'""``',
          triples: "",
          explode: "[]{}"
        },
        autoCloseTags: true,
        matchBrackets: true,
        styleActiveLine: true,
        placeholder: placeholder,
        extraKeys: {
          "Tab": function(cm) {
            cm.replaceSelection("  ", "end");
          },
          "Ctrl-Enter": function() {
            updatePreview();
          },
          "Cmd-Enter": function() {
            updatePreview();
          },
          "Ctrl-S": function() {
            saveCodeState();
          },
          "Cmd-S": function() {
            saveCodeState();
          },
        },
      });
      return cm;
    }
    async function initCodeEditor() {
      if (codeInited) {
        refreshAllEditors();
        return;
      }
      codeInited = true;
      const body = document.getElementById("code-body");
      try {
        await loadCodeEditorLibs();
      } catch (e) {
        body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;color:var(--muted-foreground);padding:2rem;text-align:center">Could not load the code editor libraries. Please check your internet connection and reload.</div>';
        codeInited = false;
        return;
      }
      // Load saved code (empty by default)
      try {
        const saved = localStorage.getItem(CODE_KEY);
        if (saved) {
          const p = JSON.parse(saved);
          if (p) {
            codeState.html = p.html || "";
            codeState.css = p.css || "";
            codeState.js = p.js || "";
          }
        }
      } catch {}
      // Create the three CodeMirror instances
      editors.html = makeEditor("editor-html", "htmlmixed", "<!-- Write HTML here -->");
      editors.css = makeEditor("editor-css", "css", "/* Write CSS here */");
      editors.js = makeEditor("editor-js", "javascript", "// Write JavaScript here");
      editors.html.setValue(codeState.html);
      editors.css.setValue(codeState.css);
      editors.js.setValue(codeState.js);
      // Change handler — sync state, debounced preview, autosave
      const onChange = function() {
        codeState.html = editors.html.getValue();
        codeState.css = editors.css.getValue();
        codeState.js = editors.js.getValue();
        clearTimeout(previewTimer);
        previewTimer = setTimeout(updatePreview, 300);
        saveCodeState();
      };
      editors.html.on("change", onChange);
      editors.css.on("change", onChange);
      editors.js.on("change", onChange);
      // Layout, splitters, resize observers
      applyEditorSizes();
      applyMainSizes();
      setupSplitters();
      setupEditorResizeObservers();
      updatePreview();
      // Fullscreen icon toggle
      document.addEventListener("fullscreenchange", function() {
        const icon = document.getElementById("fs-icon");
        if (document.fullscreenElement) {
          icon.innerHTML = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/>';
        } else {
          icon.innerHTML = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>';
        }
        refreshAllEditors();
      });
      setTimeout(refreshAllEditors, 60);
    }

    function refreshAllEditors() {
      if (!editors || !editors.html) return;
      editors.html.refresh();
      editors.css.refresh();
      editors.js.refresh();
    }

    function saveCodeState() {
      try {
        localStorage.setItem(CODE_KEY, JSON.stringify(codeState));
      } catch {}
    }

    function buildPreviewDoc() {
      return "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<style>\n" + codeState.css + "\n</style>\n</head>\n<body>\n" + codeState.html + "\n<script>\ntry {\n" + codeState.js + "\n} catch (e) {\n  console.error(e);\n  document.body.insertAdjacentHTML('beforeend', '<pre style=\"position:fixed;bottom:0;left:0;right:0;margin:0;padding:8px 12px;background:#1a0a0a;color:#ff6b6b;font:12px/1.5 monospace;white-space:pre-wrap;border-top:1px solid #ff6b6b33;z-index:9999;\">' + String(e && e.stack || e) + '<\\/pre>');\n}\n<\/script>\n</body>\n</html>";
    }

    function updatePreview() {
      const frame = document.getElementById("preview-frame");
      if (frame) frame.srcdoc = buildPreviewDoc();
    }

    function codeRun() {
      updatePreview();
    }

    function codeReset() {
      codeState = {
        html: "",
        css: "",
        js: ""
      };
      if (editors.html) {
        editors.html.setValue("");
        editors.css.setValue("");
        editors.js.setValue("");
      }
      updatePreview();
      saveCodeState();
    }

    function codeBeautify() {
      if (!editors.html) return;
      try {
        if (window.html_beautify) {
          const v = html_beautify(editors.html.getValue(), {
            indent_size: 2,
            wrap_line_length: 0,
            end_with_newline: false
          });
          editors.html.setValue(v);
          codeState.html = v;
        }
        if (window.css_beautify) {
          const v = css_beautify(editors.css.getValue(), {
            indent_size: 2
          });
          editors.css.setValue(v);
          codeState.css = v;
        }
        if (window.js_beautify) {
          const v = js_beautify(editors.js.getValue(), {
            indent_size: 2
          });
          editors.js.setValue(v);
          codeState.js = v;
        }
        updatePreview();
        saveCodeState();
      } catch (e) {
        console.error("Beautify failed", e);
      }
    }

    function codeNewTab() {
      const blob = new Blob([buildPreviewDoc()], {
        type: "text/html"
      });
      const url = URL.createObjectURL(blob);
      window.open(url, "_blank", "noopener,noreferrer");
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    }

    function codeToggleLayout() {
      codeLayout = codeLayout === "vertical" ? "horizontal" : "vertical";
      const editorsEl = document.getElementById("code-editors");
      editorsEl.classList.toggle("vertical", codeLayout === "vertical");
      editorsEl.classList.toggle("horizontal", codeLayout === "horizontal");
      document.querySelectorAll("[data-split]").forEach(function(h) {
        h.classList.toggle("row", codeLayout === "vertical");
        h.classList.toggle("col", codeLayout === "horizontal");
      });
      setTimeout(refreshAllEditors, 60);
    }

    function codeToggleFullscreen() {
      const el = document.getElementById("code-container");
      if (document.fullscreenElement) document.exitFullscreen();
      else el.requestFullscreen();
    }
    /* ---------- Unlimited splitters (drag 0–100%, no limits) ---------- */
    function applyEditorSizes() {
      const ids = ["panel-html", "panel-css", "panel-js"];
      ids.forEach(function(id, i) {
        const el = document.getElementById(id);
        if (el) el.style.flex = "0 0 " + editorSizes[i] + "%";
      });
    }

    function applyMainSizes() {
      const e = document.getElementById("code-editors");
      const p = document.getElementById("preview-panel");
      if (e) e.style.flex = "0 0 " + mainSizes[0] + "%";
      if (p) p.style.flex = "0 0 " + mainSizes[1] + "%";
    }

    function setupSplitters() {
      document.querySelectorAll("[data-split]").forEach(function(handle) {
        const index = parseInt(handle.getAttribute("data-split"), 10);
        makeSplitter(handle, function() {
          return codeLayout === "vertical" ? "y" : "x";
        }, function() {
          return {
            prev: editorSizes[index],
            next: editorSizes[index + 1],
            container: document.getElementById("code-editors")
          };
        }, function(np, nn) {
          editorSizes[index] = np;
          editorSizes[index + 1] = nn;
          applyEditorSizes();
        });
      });
      makeSplitter(document.getElementById("split-main"), function() {
        return "x";
      }, function() {
        return {
          prev: mainSizes[0],
          next: mainSizes[1],
          container: document.getElementById("code-body")
        };
      }, function(np, nn) {
        mainSizes[0] = np;
        mainSizes[1] = nn;
        applyMainSizes();
      });
    }

    function makeSplitter(handle, axisFn, stateFn, applyFn) {
      handle.addEventListener("mousedown", function(e) {
        e.preventDefault();
        const axis = axisFn();
        const state = stateFn();
        const rect = state.container.getBoundingClientRect();
        const containerSize = axis === "y" ? rect.height : rect.width;
        const startPos = axis === "y" ? e.clientY : e.clientX;
        const startPrev = state.prev;
        const startNext = state.next;
        const sum = startPrev + startNext;
        handle.classList.add("dragging");
        document.body.style.userSelect = "none";
        document.body.style.cursor = axis === "y" ? "row-resize" : "col-resize";
        // Disable pointer events on iframes so mousemove keeps firing on the document
        // (otherwise the preview iframe swallows mousemove events during drag).
        var iframes = document.querySelectorAll("iframe");
        iframes.forEach(function(f) {
          f.style.pointerEvents = "none";
        });
        var onMove = function(ev) {
          const pos = axis === "y" ? ev.clientY : ev.clientX;
          const deltaPct = (pos - startPos) / containerSize * 100;
          let np = startPrev + deltaPct;
          let nn = startNext - deltaPct;
          if (np < 0) {
            nn += np;
            np = 0;
          }
          if (nn < 0) {
            np += nn;
            nn = 0;
          }
          if (np > sum) {
            np = sum;
            nn = 0;
          }
          if (nn > sum) {
            nn = sum;
            np = 0;
          }
          applyFn(np, nn);
        };
        var onUp = function() {
          document.removeEventListener("mousemove", onMove);
          document.removeEventListener("mouseup", onUp);
          document.body.style.userSelect = "";
          document.body.style.cursor = "";
          iframes.forEach(function(f) {
            f.style.pointerEvents = "";
          });
          handle.classList.remove("dragging");
          refreshAllEditors();
        };
        document.addEventListener("mousemove", onMove);
        document.addEventListener("mouseup", onUp);
      });
    }

    function setupEditorResizeObservers() {
      const hosts = [
        ["host-html", "html"],
        ["host-css", "css"],
        ["host-js", "js"]
      ];
      hosts.forEach(function(pair) {
        const host = document.getElementById(pair[0]);
        if (!host || !editors[pair[1]] || !window.ResizeObserver) return;
        const ro = new ResizeObserver(function() {
          editors[pair[1]].refresh();
        });
        ro.observe(host);
      });
    }
    /* ---------- Keyboard: Escape closes modal ---------- */
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape" && activeGame) closePlayer();
    });
    /* ---------- Responsive nav labels ---------- */
    function updateNavLabels() {
      const narrow = window.innerWidth < 640;
      document.querySelectorAll(".nav-label").forEach(el => {
        if (narrow && !el.classList.contains("nav-label-md")) el.style.display = "none";
        else if (!el.classList.contains("nav-label-md")) el.style.display = "inline";
      });
      document.querySelectorAll(".nav-label-md").forEach(el => {
        el.style.display = window.innerWidth < 768 ? "none" : "inline";
      });
    }
    /* ---------- Apply site config (name / logo / tagline / favicon) ---------- */
    var FALLBACK_LOGO_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.152A4 4 0 0 0 17.32 5z"/></svg>';
    var FALLBACK_FOOTER_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="11" x2="10" y2="11"/><line x1="8" y1="9" x2="8" y2="13"/><line x1="15" y1="12" x2="15.01" y2="12"/><line x1="18" y1="10" x2="18.01" y2="10"/><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.152A4 4 0 0 0 17.32 5z"/></svg>';

    function applySiteConfig() {
      // Browser tab title + meta description
      document.title = SITE.name + (SITE.titleSuffix || "");
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute("content", SITE.tagline);
      
      // Set Favicon for browser tab
      let faviconLink = document.querySelector("link[rel='icon']");
      if (!faviconLink) {
        faviconLink = document.createElement('link');
        faviconLink.rel = 'icon';
        document.head.appendChild(faviconLink);
      }
      if (SITE.favicon && SITE.favicon.trim() !== "") {
        faviconLink.href = SITE.favicon;
      }
      
      // Header logo button label + name text
      const logoBtn = document.getElementById("logo-btn");
      if (logoBtn) logoBtn.setAttribute("aria-label", SITE.name + " home");
      const logoText = document.getElementById("logo-text");
      if (logoText) logoText.textContent = SITE.name;
      // Header logo badge: image if logo URL set, else fallback icon
      const logoBadge = document.getElementById("logo-badge");
      if (logoBadge) {
        if (SITE.logo && SITE.logo.trim() !== "") {
          logoBadge.innerHTML = '<img src="' + escapeHtml(SITE.logo) + '" alt="' + escapeHtml(SITE.name) + ' logo" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.innerHTML=window.FALLBACK_LOGO_SVG">';
        } else {
          logoBadge.innerHTML = FALLBACK_LOGO_SVG;
        }
      }
      // Footer name + tagline + copyright name
      const fName = document.getElementById("footer-name");
      if (fName) fName.textContent = SITE.name;
      const fTag = document.getElementById("footer-tagline");
      if (fTag) fTag.textContent = SITE.tagline;
      const fCopy = document.getElementById("footer-copy-name");
      if (fCopy) fCopy.textContent = SITE.name;
      // Footer badge: image if logo URL set, else fallback icon
      const fBadge = document.getElementById("footer-badge");
      if (fBadge) {
        if (SITE.logo && SITE.logo.trim() !== "") {
          fBadge.innerHTML = '<img src="' + escapeHtml(SITE.logo) + '" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.innerHTML=window.FALLBACK_FOOTER_SVG">';
        } else {
          fBadge.innerHTML = FALLBACK_FOOTER_SVG;
        }
      }
    }
    /* ---------- Init ---------- */
    function init() {
      document.getElementById("year").textContent = new Date().getFullYear();
      applySiteConfig();
      loadTheme();
      favorites = loadFavorites();
      recent = loadRecent();
      updateFavCount();
      setView("games");
      updateNavLabels();
      window.addEventListener("resize", updateNavLabels);
    }
    init();
  </script>
