<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Code Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header"><div class="header-inner">
    <button class="logo-btn" onclick="navigate('index.html')" id="logo-btn"><span class="logo-badge" id="logo-badge"></span><span class="logo-text" id="logo-text"></span></button>
    <nav class="nav" role="navigation">
      <button class="nav-btn" data-route="index.html" onclick="navigate('index.html')"><span>Games</span></button>
      <button class="nav-btn" data-route="apps.html" onclick="navigate('apps.html')"><span>Apps</span></button>
      <button class="nav-btn" data-route="favorites.html" onclick="navigate('favorites.html')"><span>Favorites</span><span class="nav-badge hidden" id="fav-count">0</span></button>
      <button class="nav-btn active" data-route="code.html" onclick="navigate('code.html')"><span>Code</span></button>
    </nav>
    <div class="spacer-flex"></div>
    <button class="icon-btn" onclick="toggleTheme()"><svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle></svg></button>
  </div></header>

  <main class="main" style="height: calc(100vh - 4rem); padding: 1rem;">
    <div style="display: flex; flex-direction: column; height: 100%; overflow: hidden; border-radius: .75rem; border: 1px solid var(--border); background: var(--card);">
      <div style="display: flex; align-items: center; gap: .5rem; border-bottom: 1px solid var(--border); background: var(--muted); padding: .5rem .75rem;">
        <span style="font-weight:600">Code Editor</span>
        <div style="margin-left: auto; display: flex; gap: .5rem;">
          <button class="btn btn-sm btn-ghost" onclick="codeRun()">Run</button>
          <button class="btn btn-sm btn-ghost" onclick="codeReset()">Reset</button>
        </div>
      </div>
      <div style="flex: 1; overflow: hidden; display: flex; flex-direction: row;">
        <div id="host-html" style="flex:1; overflow:hidden;"><textarea id="editor-html" spellcheck="false" style="width:100%;height:100%;border:0;"></textarea></div>
        <div style="width:6px;background:var(--border);cursor:col-resize;"></div>
        <div id="host-css" style="flex:1; overflow:hidden;"><textarea id="editor-css" spellcheck="false" style="width:100%;height:100%;border:0;"></textarea></div>
        <div style="width:6px;background:var(--border);cursor:col-resize;"></div>
        <div id="host-js" style="flex:1; overflow:hidden;"><textarea id="editor-js" spellcheck="false" style="width:100%;height:100%;border:0;"></textarea></div>
        <div style="width:6px;background:var(--border);cursor:col-resize;"></div>
        <iframe id="preview-frame" style="flex:1.5; border:0; background:#fff;" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"></iframe>
      </div>
    </div>
  </main>

  <script src="config.js"></script><script src="app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script>
    initBase('code.html');
    let editors = {};
    function initCode() {
      editors.html = CodeMirror.fromTextArea(document.getElementById('editor-html'), { mode: "htmlmixed", lineNumbers: true });
      editors.css = CodeMirror.fromTextArea(document.getElementById('editor-css'), { mode: "css", lineNumbers: true });
      editors.js = CodeMirror.fromTextArea(document.getElementById('editor-js'), { mode: "javascript", lineNumbers: true });
      
      const saved = localStorage.getItem("arcade:code-editor");
      if (saved) {
        const p = JSON.parse(saved);
        editors.html.setValue(p.html || "");
        editors.css.setValue(p.css || "");
        editors.js.setValue(p.js || "");
      }
      
      const onChange = () => {
        const state = { html: editors.html.getValue(), css: editors.css.getValue(), js: editors.js.getValue() };
        localStorage.setItem("arcade:code-editor", JSON.stringify(state));
        updatePreview();
      };
      editors.html.on("change", onChange);
      editors.css.on("change", onChange);
      editors.js.on("change", onChange);
      updatePreview();
    }
    function updatePreview() {
      const html = editors.html.getValue();
      const css = editors.css.getValue();
      const js = editors.js.getValue();
      const doc = `<!DOCTYPE html><html><head><style>${css}</style></head><body>${html}<script>try{${js}}catch(e){console.error(e)}<\/script></body></html>`;
      document.getElementById('preview-frame').srcdoc = doc;
    }
    function codeRun() { updatePreview(); }
    function codeReset() {
      editors.html.setValue("");
      editors.css.setValue("");
      editors.js.setValue("");
      updatePreview();
    }
    initCode();
  </script>
</body>
</html>
