<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Code Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header"><div class="header-inner">
    <button class="logo-btn" onclick="navigate('./')" id="logo-btn"><span class="logo-badge" id="logo-badge"></span><span class="logo-text" id="logo-text"></span></button>
    <nav class="nav" role="navigation">
      <button class="nav-btn" data-route="./" onclick="navigate('./')"><span>Games</span></button>
      <button class="nav-btn" data-route="apps" onclick="navigate('apps')"><span>Apps</span></button>
      <button class="nav-btn" data-route="favorites" onclick="navigate('favorites')"><span>Favorites</span><span class="nav-badge hidden" id="fav-count">0</span></button>
      <button class="nav-btn active" data-route="code" onclick="navigate('code')"><span>Code</span></button>
    </nav>
    <div class="spacer-flex"></div>
    <button class="icon-btn" onclick="toggleTheme()"><svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
  </div></header>

  <main class="main">
    <div id="view-code" class="code-wrap">
      <div class="code-container" id="code-container">
        <div class="code-toolbar">
          <div class="code-toolbar-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
            <span class="nav-label" style="display: inline;">Code Editor</span>
          </div>
          <div class="code-toolbar-actions">
            <button class="btn btn-ghost btn-sm" onclick="codeBeautify()" title="Beautify (format HTML, CSS &amp; JS)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4V2"></path><path d="M15 16v-2"></path><path d="M8 9h2"></path><path d="M20 9h2"></path><path d="M17.8 11.8 19 13"></path><path d="M15 9h.01"></path><path d="M17.8 6.2 19 5"></path><path d="m3 21 9-9"></path><path d="M12.2 6.2 11 5"></path></svg>
              <span class="nav-label" style="display: inline;">Beautify</span>
            </button>
            <button class="btn btn-ghost btn-sm" onclick="codeRun()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <span class="nav-label" style="display: inline;">Run</span>
            </button>
            <button class="btn btn-ghost btn-sm" onclick="codeReset()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
              <span class="nav-label" style="display: inline;">Reset</span>
            </button>
            <button class="btn btn-ghost btn-sm" onclick="codeNewTab()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
              <span class="nav-label nav-label-md" style="display: inline;">New tab</span>
            </button>
            <div class="code-divider"></div>
            <button class="btn btn-ghost btn-sm" onclick="codeToggleLayout()" aria-label="Toggle layout">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
              <span class="nav-label nav-label-md" style="display: inline;">Layout</span>
            </button>
            <button class="btn btn-ghost btn-icon" onclick="codeToggleFullscreen()" id="fs-btn" aria-label="Toggle fullscreen">
              <svg id="fs-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
            </button>
          </div>
        </div>
        <div class="code-body" id="code-body">
          <div class="code-editors vertical" id="code-editors">
            <div class="editor-panel" id="panel-html"><div class="editor-header"><span class="editor-dot" style="background:#e34c26"></span><span class="editor-label">HTML</span></div><div class="editor-host" id="host-html"><textarea id="editor-html" spellcheck="false"></textarea></div></div>
            <div class="splitter row" data-split="0"></div>
            <div class="editor-panel" id="panel-css"><div class="editor-header"><span class="editor-dot" style="background:#06b6d4"></span><span class="editor-label">CSS</span></div><div class="editor-host" id="host-css"><textarea id="editor-css" spellcheck="false"></textarea></div></div>
            <div class="splitter row" data-split="1"></div>
            <div class="editor-panel" id="panel-js"><div class="editor-header"><span class="editor-dot" style="background:#eab308"></span><span class="editor-label">JS</span></div><div class="editor-host" id="host-js"><textarea id="editor-js" spellcheck="false"></textarea></div></div>
          </div>
          <div class="splitter col" id="split-main"></div>
          <div class="preview-panel" id="preview-panel">
            <div class="preview-bar"><div class="preview-dots"><span style="background:#f87171"></span><span style="background:#fbbf24"></span><span style="background:#34d399"></span></div><span class="preview-label">Preview</span></div>
            <iframe class="preview-frame" id="preview-frame" title="Preview" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"></iframe>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="config.js"></script><script src="app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script>
    let editors = { html: null, css: null, js: null };
    let editorSizes = [33.33, 33.33, 33.34]; let mainSizes = [60, 40]; let codeLayout = "vertical";
    
    function initCodeEditor() {
      if (typeof CodeMirror === 'undefined') {
        setTimeout(initCodeEditor, 50); // Wait for CodeMirror to load
        return;
      }
      editors.html = CodeMirror.fromTextArea(document.getElementById('editor-html'), { mode: "htmlmixed", lineNumbers: true });
      editors.css = CodeMirror.fromTextArea(document.getElementById('editor-css'), { mode: "css", lineNumbers: true });
      editors.js = CodeMirror.fromTextArea(document.getElementById('editor-js'), { mode: "javascript", lineNumbers: true });
      
      try {
        const saved = localStorage.getItem(CODE_KEY);
        if (saved) {
          const p = JSON.parse(saved);
          if (p) {
            editors.html.setValue(p.html || "");
            editors.css.setValue(p.css || "");
            editors.js.setValue(p.js || "");
          }
        }
      } catch {}
      
      const onChange = () => {
        const state = { html: editors.html.getValue(), css: editors.css.getValue(), js: editors.js.getValue() };
        localStorage.setItem(CODE_KEY, JSON.stringify(state));
        updatePreview();
      };
      editors.html.on("change", onChange);
      editors.css.on("change", onChange);
      editors.js.on("change", onChange);
      applyEditorSizes(); applyMainSizes(); setupSplitters(); updatePreview();
    }
    function updatePreview() {
      const html = editors.html.getValue();
      const css = editors.css.getValue();
      const js = editors.js.getValue();
      const doc = `<!DOCTYPE html><html><head><style>${css}</style></head><body>${html}<script>try{${js}}catch(e){console.error(e)}<\/script></body></html>`;
      document.getElementById('preview-frame').srcdoc = doc;
    }
    function codeRun() { updatePreview(); }
    function codeReset() {
      editors.html.setValue(""); editors.css.setValue(""); editors.js.setValue("");
      updatePreview();
    }
    function codeBeautify() {
      // Optional: requires js-beautify library
      console.log("Beautify clicked");
    }
    function codeNewTab() {
      const html = editors.html.getValue();
      const css = editors.css.getValue();
      const js = editors.js.getValue();
      const doc = `<!DOCTYPE html><html><head><style>${css}</style></head><body>${html}<script>try{${js}}catch(e){console.error(e)}<\/script></body></html>`;
      const newWin = window.open('about:blank', '_blank');
      if (newWin) {
        newWin.document.write(doc);
        newWin.document.close();
      }
    }
    function codeToggleLayout() {
      codeLayout = codeLayout === "vertical" ? "horizontal" : "vertical";
      const editorsEl = document.getElementById("code-editors");
      editorsEl.classList.toggle("vertical", codeLayout === "vertical");
      editorsEl.classList.toggle("horizontal", codeLayout === "horizontal");
      document.querySelectorAll("[data-split]").forEach(function(h) { h.classList.toggle("row", codeLayout === "vertical"); h.classList.toggle("col", codeLayout === "horizontal"); });
    }
    function codeToggleFullscreen() {
      const el = document.getElementById("code-container");
      if (document.fullscreenElement) document.exitFullscreen();
      else el.requestFullscreen();
    }
    function applyEditorSizes() { const ids = ["panel-html", "panel-css", "panel-js"]; ids.forEach(function(id, i) { const el = document.getElementById(id); if (el) el.style.flex = "0 0 " + editorSizes[i] + "%"; }); }
    function applyMainSizes() { const e = document.getElementById("code-editors"); const p = document.getElementById("preview-panel"); if (e) e.style.flex = "0 0 " + mainSizes[0] + "%"; if (p) p.style.flex = "0 0 " + mainSizes[1] + "%"; }
    function setupSplitters() {
      document.querySelectorAll("[data-split]").forEach(function(handle) {
        const index = parseInt(handle.getAttribute("data-split"), 10);
        makeSplitter(handle, function() { return codeLayout === "vertical" ? "y" : "x"; }, function() { return { prev: editorSizes[index], next: editorSizes[index + 1], container: document.getElementById("code-editors") }; }, function(np, nn) { editorSizes[index] = np; editorSizes[index + 1] = nn; applyEditorSizes(); });
      });
      makeSplitter(document.getElementById("split-main"), function() { return "x"; }, function() { return { prev: mainSizes[0], next: mainSizes[1], container: document.getElementById("code-body") }; }, function(np, nn) { mainSizes[0] = np; mainSizes[1] = nn; applyMainSizes(); });
    }
    function makeSplitter(handle, axisFn, stateFn, applyFn) {
      handle.addEventListener("mousedown", function(e) {
        e.preventDefault(); const axis = axisFn(); const state = stateFn(); const rect = state.container.getBoundingClientRect();
        const containerSize = axis === "y" ? rect.height : rect.width; const startPos = axis === "y" ? e.clientY : e.clientX;
        const startPrev = state.prev; const startNext = state.next; const sum = startPrev + startNext;
        handle.classList.add("dragging"); document.body.style.userSelect = "none"; document.body.style.cursor = axis === "y" ? "row-resize" : "col-resize";
        var iframes = document.querySelectorAll("iframe"); iframes.forEach(function(f) { f.style.pointerEvents = "none"; });
        var onMove = function(ev) {
          const pos = axis === "y" ? ev.clientY : ev.clientX; const deltaPct = (pos - startPos) / containerSize * 100;
          let np = startPrev + deltaPct; let nn = startNext - deltaPct;
          if (np < 0) { nn += np; np = 0; } if (nn < 0) { np += nn; nn = 0; } if (np > sum) { np = sum; nn = 0; } if (nn > sum) { nn = sum; np = 0; }
          applyFn(np, nn);
        };
        var onUp = function() { document.removeEventListener("mousemove", onMove); document.removeEventListener("mouseup", onUp); document.body.style.userSelect = ""; document.body.style.cursor = ""; iframes.forEach(function(f) { f.style.pointerEvents = ""; }); handle.classList.remove("dragging"); };
        document.addEventListener("mousemove", onMove); document.addEventListener("mouseup", onUp);
      });
    }
    
    initBase('code');
    initCodeEditor();
  </script>
</body>
</html>
