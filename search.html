<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <button class="logo-btn" onclick="navigate('index.html')" id="logo-btn"><span class="logo-badge" id="logo-badge"></span><span class="logo-text" id="logo-text"></span></button>
      <nav class="nav" role="navigation">
        <button class="nav-btn" data-route="index.html" onclick="navigate('index.html')"><span>Games</span></button>
        <button class="nav-btn" data-route="apps.html" onclick="navigate('apps.html')"><span>Apps</span></button>
        <button class="nav-btn" data-route="favorites.html" onclick="navigate('favorites.html')"><span>Favorites</span><span class="nav-badge hidden" id="fav-count">0</span></button>
        <button class="nav-btn" data-route="code.html" onclick="navigate('code.html')"><span>Code</span></button>
      </nav>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input class="search-input" type="search" id="search-box" placeholder="Search games…">
      </div>
      <div class="spacer-flex"></div>
      <button class="icon-btn" onclick="toggleTheme()"><svg id="theme-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle></svg></button>
    </div>
  </header>
  <main class="main"><div id="view-search" class="container"></div></main>
  <footer class="footer"><div class="footer-inner"><div class="footer-brand"><span class="footer-badge" id="footer-badge"></span><span><strong id="footer-name"></strong><span> · </span><span id="footer-tagline"></span></span></div><p>© <span id="year"></span> <span id="footer-copy-name"></span>.</p></div></footer>

  <script src="config.js"></script><script src="app.js"></script>
  <script>
    function renderCurrentView() {
      const params = new URLSearchParams(window.location.search);
      const q = params.get('q') || "";
      const cat = params.get('cat') || "All";
      document.getElementById('search-box').value = q;
      setTitle("Search: " + q);
      const filtered = searchGames(q, cat);
      let html = `<div class="grid-header"><div><h2>${q ? 'Results for "' + escapeHtml(q) + '"' : 'All Games'}</h2><p>${filtered.length} found</p></div>`;
      html += '<div class="chips">';
      ["All"].concat(GENRES).forEach(o => html += `<button class="chip ${o===cat?'active':''}" onclick="navigate('search.html?cat=${encodeURIComponent(o)}')">${escapeHtml(o)}</button>`);
      html += '</div></div>';
      if (filtered.length === 0) html += '<div class="empty"><h3>No games found</h3><p>Try a different search term or genre.</p></div>';
      else { html += '<div class="game-grid">'; filtered.forEach(g => html += renderCard(g, 'game')); html += '</div>'; }
      document.getElementById("view-search").innerHTML = html;
    }
    document.getElementById('search-box').addEventListener('input', function(e) {
      history.replaceState({}, "", `search.html?q=${encodeURIComponent(e.target.value)}`);
      renderCurrentView();
    });
    initBase('search.html');
    renderCurrentView();
  </script>
</body>
</html>
